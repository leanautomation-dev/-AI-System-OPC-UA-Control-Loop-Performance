version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# CLPM OPC-UA AI System  –  Docker Compose Stack
# Services:
#   timescaledb      PostgreSQL + TimescaleDB (time-series DB)
#   redis            Message broker + cache
#   opcua-server     Simulated OPC-UA PLC server (asyncua)
#   opcua-client     OPC-UA subscriber → DB writer
#   api              FastAPI REST + WebSocket server
#   frontend         React Vite app (Nginx)
#   superset         Apache Superset analytics
#   superset-db      Superset metadata DB
#   superset-init    One-shot initialisation
#   nginx            Reverse proxy / unified entry point
# ──────────────────────────────────────────────────────────────────────────────

x-common-backend: &common-backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  depends_on:
    timescaledb:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── TimescaleDB ─────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: streampipes
      POSTGRES_USER: streampipes
      POSTGRES_PASSWORD: streampipes
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streampipes -d streampipes"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_preload_libraries=timescaledb
        -c max_connections=200
        -c shared_buffers=256MB
        -c work_mem=16MB

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── OPC-UA Server (simulation) ───────────────────────────────────────────────
  opcua-server:
    <<: *common-backend
    command: python opcua_server.py
    ports:
      - "4840:4840"
    environment:
      DATABASE_URL: postgresql://streampipes:streampipes@timescaledb:5432/streampipes
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - timescaledb

  # ── OPC-UA Client (subscriber + DB writer) ──────────────────────────────────
  opcua-client:
    <<: *common-backend
    command: python opcua_client.py
    environment:
      DATABASE_URL: postgresql://streampipes:streampipes@timescaledb:5432/streampipes
      REDIS_URL: redis://redis:6379/0
      OPCUA_REAL_ENDPOINT: opc.tcp://opcua-server:4840/clpm/server
    depends_on:
      - opcua-server
      - timescaledb
      - redis

  # ── CSV Seed (one-shot) ──────────────────────────────────────────────────────
  csv-seed:
    <<: *common-backend
    command: python db/load_csv.py --csv /data/Data_ControlLoopPerformanceMonitoring.csv
    volumes:
      - ./backend/db/data.csv:/data/Data_ControlLoopPerformanceMonitoring.csv:ro
    environment:
      DATABASE_URL: postgresql://streampipes:streampipes@timescaledb:5432/streampipes
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy

  # ── FastAPI API Server ────────────────────────────────────────────────────────
  api:
    <<: *common-backend
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://streampipes:streampipes@timescaledb:5432/streampipes
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      VITE_API_URL: http://api:8000
      VITE_SUPERSET_URL: http://superset:8088

  # ── Superset Metadata DB ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Superset ───────────────────────────────────────────────────────────
  superset:
    image: apache/superset:3.1.3
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: clpm-superset-secret-change-in-prod
      postgres_URI: postgresql+psycopg2://superset:superset_pass@postgres:5432/superset
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://streampipes:streampipes@timescaledb:5432/streampipes
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Superset Init (one-shot) ──────────────────────────────────────────────────
  superset-init:
    image: apache/superset:3.1.3
    restart: "no"
    environment:
      SUPERSET_SECRET_KEY: clpm-superset-secret-change-in-prod
      postgres_URI: postgresql+psycopg2://superset:superset_pass@postgres:5432/superset
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin
          --username admin --firstname Admin --lastname User
          --email admin@clpm.local --password admin &&
        superset init
      "
    depends_on:
      postgres:
        condition: service_healthy

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
      - superset

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  tsdb_data:
  redis_data:
  postgres_data:
  superset_home:
